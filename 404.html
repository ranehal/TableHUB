<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TableHUB - Luxury Dining & Table Reservation</title>
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var subPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPath + '/#' + (subPath ? '/' + subPath : '') +
        (l.search ? '?' + l.search.slice(1) : '')
      );
    </script>
  </head>
  <body style="background-color: #0f0f0f; color: #d4af37; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h1 style="margin-bottom: 8px;">TableHUB</h1>
      <p style="color: #9ca3af;">Redirecting to your destination...</p>
    </div>
  </body>
</html>
